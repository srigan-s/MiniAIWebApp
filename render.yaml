databases:
  - name: miniai-db
    databaseName: miniai
    user: miniai

services:
  - type: web
    name: miniai-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: miniai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
